spring.application.name=E-Commerce

# MySQL Configuration
# Values come from environment variables when set (see Deployment\DEPLOY_STEPS.txt).
# If a variable is missing, the value after ":" is used, so local runs keep working.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:001100}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
# Generate a unique value for the server: openssl rand -base64 48
app.jwtSecret=${JWT_SECRET:mySecretKeyForECommerceProjectWhichShouldBeAtLeast256BitsLongForHS256Algorithm1234567890}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ANSI Colors for IntelliJ console
spring.output.ansi.enabled=always

# Server
# Hosting platforms (Render, Railway, etc.) pass their own PORT. Locally it stays 8080.
server.port=${PORT:8080}
